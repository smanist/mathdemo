<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Explicit Euler slope step</title>
  <desc id="desc">The tangent slope at the current point is used to advance one step.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="80" y1="290" x2="650" y2="290"/>
    <line x1="80" y1="60" x2="80" y2="290"/>
  </g>
  <path d="M80 90 C165 112 220 200 305 226 C390 250 500 218 650 138" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="125" y1="105" x2="315" y2="185" stroke="#2563eb" stroke-width="4"/>
  <g stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5">
    <line x1="150" y1="116" x2="150" y2="290"/>
    <line x1="300" y1="179" x2="300" y2="290"/>
    <line x1="150" y1="116" x2="300" y2="179"/>
  </g>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="116" r="7"/>
    <circle cx="300" cy="179" r="7"/>
  </g>
  <path d="M150 290 L300 290" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <g fill="#374151" font-family="Arial, sans-serif" font-size="18">
    <text x="210" y="320">h</text>
    <text x="144" y="312">x_n</text>
    <text x="284" y="312">x_{n+1}</text>
    <text x="336" y="178">slope = f(x_n, y_n)</text>
  </g>
</svg>
